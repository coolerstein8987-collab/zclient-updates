<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:" />
<title>Zync – Verbinden</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #eef1f8;
    background: radial-gradient(60% 60% at 20% 20%, #4c2fb0, transparent), radial-gradient(60% 60% at 80% 80%, #0e7490, transparent), #06070b; -webkit-app-region: drag; }
  .card { width: 420px; padding: 32px; border-radius: 24px; background: rgba(16, 19, 27, .85); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.5); -webkit-app-region: no-drag; }
  img { width: 64px; border-radius: 16px; }
  h1 { margin: 16px 0 6px; font-size: 22px; }
  p { color: #a9b2c6; margin: 0 0 18px; line-height: 1.5; font-size: 14px; }
  input { width: 100%; box-sizing: border-box; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: #0b0d13; color: #fff; padding: 0 14px; font-size: 15px; outline: none; }
  input:focus { border-color: #7c5cff; }
  button { margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 12px; font-weight: 700; font-size: 15px; color: #fff; cursor: pointer; background: linear-gradient(135deg, #7c5cff, #00d4ff); }
  .err { color: #fb7185; font-size: 13px; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
  <form class="card" id="f">
    <img src="icons/icon.png" alt="Zync" />
    <h1>Mit Zync-Server verbinden</h1>
    <p>Gib die Adresse deines Zync-Servers ein, z. B. <b>https://zync.example.com</b> oder <b>http://localhost:3001</b>.</p>
    <input id="u" placeholder="https://…" autofocus />
    <div class="err" id="e"></div>
    <button type="submit">Verbinden</button>
  </form>
  <script>
    const u = document.getElementById('u');
    window.zyncDesktop.getServer().then((s) => { u.value = s; });
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const v = u.value.trim();
      if (!/^https?:\/\/.+/.test(v)) { document.getElementById('e').textContent = 'Bitte eine gültige Adresse mit http:// oder https:// eingeben.'; return; }
      await window.zyncDesktop.setServer(v);
    });
  </script>
</body>
</html>
