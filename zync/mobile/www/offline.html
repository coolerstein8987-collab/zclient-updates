<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Zync – offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(70% 50% at 15% 0%, rgba(139, 92, 246, .22), transparent 70%), #0b0d12;
      color: #eef1f8; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; padding: 24px; text-align: center; -webkit-tap-highlight-color: transparent;
    }
    main { width: min(380px, 100%); }
    .logo { width: 84px; height: 84px; margin: 0 auto; filter: drop-shadow(0 16px 40px rgba(139, 92, 246, .45)); opacity: .9; animation: bob 3s ease-in-out infinite; }
    .logo svg { width: 100%; height: 100%; }
    @keyframes bob { 50% { transform: translateY(-5px); } }
    h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -.02em; margin-top: 18px; }
    p { color: #8a93a8; margin-top: 8px; }
    button { width: 100%; height: 50px; margin-top: 12px; border: 0; border-radius: 14px; font-size: 1rem; font-weight: 800; color: #fff; background: linear-gradient(135deg, #8b5cf6, #06b6d4); }
    button.ghost { background: transparent; border: 1px solid #232838; color: #8a93a8; }
    .actions { margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<linearGradient id="zaurorag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<radialGradient id="zaurorah" cx="0.25" cy="0.15" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>

</defs>
<rect width="512" height="512" rx="128" fill="url(#zaurorag)"/>
<rect width="512" height="512" rx="128" fill="url(#zaurorah)"/>
<ellipse cx="256" cy="262" rx="196" ry="74" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="14" transform="rotate(-24 256 262)"/>
<polyline points="160,166 352,166 166,350 356,350" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="404" cy="116" r="28" fill="#fff"/>
</svg></div>
    <h1>Keine Verbindung 😴</h1>
    <p>Zync ist gerade nicht erreichbar. Vielleicht bist du offline oder der Server wacht noch auf.</p>
    <div class="actions">
      <button type="button" onclick="location.replace('/')">Nochmal versuchen</button>
      <button type="button" class="ghost" onclick="location.href='zync://setup'">Server-Adresse ändern</button>
    </div>
  </main>
</body>
</html>
