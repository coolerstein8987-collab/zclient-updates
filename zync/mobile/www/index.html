<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Zync</title>
  <style>
    :root { --bg: #0b0d12; --card: #12151d; --line: #232838; --text: #eef1f8; --muted: #8a93a8; --a1: #8b5cf6; --a2: #06b6d4; --bad: #f43f5e; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(70% 50% at 15% 0%, rgba(139, 92, 246, .28), transparent 70%), radial-gradient(60% 45% at 100% 100%, rgba(6, 182, 212, .22), transparent 70%), var(--bg);
      color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid; place-items: center; padding: 24px; -webkit-tap-highlight-color: transparent;
    }
    main { width: min(420px, 100%); text-align: center; animation: in .6s cubic-bezier(.2, .9, .3, 1.2); }
    @keyframes in { from { opacity: 0; transform: translateY(16px) scale(.98); } }
    .logo { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 18px 50px -12px rgba(139, 92, 246, .7); animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-6px) rotate(-3deg); } }
    h1 { font-size: 1.9rem; font-weight: 900; letter-spacing: -.03em; margin-top: 18px; }
    .sub { color: var(--muted); margin-top: 6px; }
    form { margin-top: 26px; padding: 20px; border-radius: 22px; background: color-mix(in srgb, var(--card) 85%, transparent); border: 1px solid var(--line); text-align: left; }
    label { display: block; font-size: .74rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    input { width: 100%; height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: #090b10; color: var(--text); font-size: 1rem; outline: none; transition: border-color .15s, box-shadow .15s; }
    input:focus { border-color: rgba(139, 92, 246, .8); box-shadow: 0 0 0 4px rgba(139, 92, 246, .2); }
    .hint { font-size: .82rem; color: var(--muted); margin-top: 8px; }
    button { width: 100%; height: 50px; margin-top: 16px; border: 0; border-radius: 14px; font-size: 1rem; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 10px 30px -10px rgba(139, 92, 246, .8); display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .15s, opacity .15s; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .7; }
    button.ghost { background: transparent; box-shadow: none; border: 1px solid var(--line); color: var(--muted); margin-top: 10px; }
    .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { margin-top: 12px; font-size: .88rem; min-height: 1.3em; color: var(--muted); }
    .msg.bad { color: var(--bad); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icon.svg" alt="" />
    <h1>Willkommen bei Zync</h1>
    <p class="sub">Verbinde die App einmalig mit deinem Zync-Server.</p>
    <form id="form" novalidate>
      <label for="url">Server-Adresse</label>
      <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="dein-zync.onrender.com" required />
      <p class="hint">Die Adresse, unter der du Zync im Browser öffnest – bei Render steht sie oben im Dashboard (…onrender.com).</p>
      <button id="go" type="submit"><span id="go-label">Verbinden</span></button>
      <button id="force" class="ghost" type="button" hidden>Trotzdem verbinden</button>
      <p id="msg" class="msg" role="status"></p>
    </form>
  </main>
  <script>
    const KEY = 'zync.server';
    const $ = (id) => document.getElementById(id);
    const input = $('url');
    try { input.value = localStorage.getItem(KEY) || ''; } catch { /* egal */ }

    const normalize = (raw) => {
      let v = raw.trim();
      if (!v) return null;
      if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
      try {
        const u = new URL(v);
        return u.origin;
      } catch {
        return null;
      }
    };
    const connect = (url) => {
      try { localStorage.setItem(KEY, url); } catch { /* egal */ }
      location.href = 'zync://connect?url=' + encodeURIComponent(url);
    };
    const busy = (on, label) => {
      $('go').disabled = on;
      $('go-label').textContent = label || 'Verbinden';
      $('go').querySelector('.spin')?.remove();
      if (on) $('go').prepend(Object.assign(document.createElement('span'), { className: 'spin' }));
    };
    const say = (text, bad) => { $('msg').textContent = text; $('msg').className = 'msg' + (bad ? ' bad' : ''); };

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = normalize(input.value);
      $('force').hidden = true;
      if (!url) { say('Bitte gib eine gültige Adresse ein.', true); input.focus(); return; }
      busy(true, 'Verbinde …');
      say('');
      // Render-Server im Gratis-Plan schlafen nach einer Weile – das Aufwecken dauert bis zu einer Minute.
      const slow = setTimeout(() => say('Server wird aufgeweckt … das kann bis zu einer Minute dauern ☕'), 4000);
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 90000);
      try {
        await fetch(url + '/manifest.webmanifest', { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
        connect(url);
      } catch {
        busy(false);
        say('Der Server antwortet nicht. Stimmt die Adresse und bist du online?', true);
        $('force').hidden = false;
      } finally {
        clearTimeout(slow);
        clearTimeout(timeout);
      }
    });
    $('force').addEventListener('click', () => {
      const url = normalize(input.value);
      if (url) connect(url);
    });
  </script>
</body>
</html>
